<div class="app-shell" [class.page-dark]="darkMode">
  <app-header
    [activeSection]="currentSection"
    (sectionChange)="onSectionChange($event)"
    [(darkMode)]="darkMode"
  ></app-header>

  <main class="content">
    <p class="selection">
      Sección seleccionada: {{ currentSection }}
    </p>
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
